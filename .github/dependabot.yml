version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'

  # npm dependencies for the main workspace
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      docusaurus-and-typedoc:
        patterns:
          - '@docusaurus/*'
          - 'docusaurus-*'
          - 'typedoc'
          - 'typedoc-*'
          - '@easyops-cn/docusaurus-search-local'

      flow-and-hermes:
        patterns:
          - 'hermes-*'
          - 'flow-*'
          - '@babel/preset-flow'

      rollup:
        patterns:
          - '@rollup/*'
          - 'rollup'
          - 'rollup-*'

      shikijs:
        patterns:
          - '@shikijs/*'
          - 'shiki'

      # vitest and its companion packages declare each other as exact-version
      # peers (vitest@x.y.z requires @vitest/browser-playwright@x.y.z and vice
      # versa), so a PR that bumps only one of them leaves the workspace on
      # mixed versions and the browser test runner refuses to start. Group them
      # so they always move together.
      vitest:
        patterns:
          - 'vitest'
          - 'vitest-*'
          - '@vitest/*'

      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is the native (Go) compiler and no longer ships the
      # JavaScript compiler API that our tooling builds on: typedoc and
      # typescript-eslint both refuse to load against it (their peer ranges
      # stop at 6.0.x), so a TS 7 bump breaks `pnpm run lint` and the website
      # build. TypeScript 6 is the maintained API-compatible line, so stay on
      # it until those tools support the 7.x API.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    # Examples and integration test fixtures are standalone projects
    # (excluded from the pnpm workspace). Their lockfiles are not tracked
    # in git, so Dependabot does not need to manage them.
    exclude-paths:
      - 'examples/**'
      - 'scripts/__tests__/integration/fixtures/**'
