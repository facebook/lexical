name: Publish DevTools extension to stores

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version'
        required: true
        default: 0
        type: number
  workflow_call:
    inputs:
      ref:
        description: 'Exact npm release commit to build'
        required: true
        type: string
      build_version:
        description: 'Build version'
        required: false
        default: 0
        type: number

permissions: {}

jobs:
  release:
    if: github.repository_owner == 'facebook'
    runs-on: ubuntu-latest
    concurrency:
      # Manual and npm release calls must not publish to the stores concurrently.
      group: devtools-extension-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24.x
      - name: Zip & submit to stores
        run: pnpm run publish-extension
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.EXTENSION_FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.EXTENSION_FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.EXTENSION_FIREFOX_JWT_SECRET }}
          # Chrome Web Store API v2 setup: packages/lexical-devtools/README.md
          CHROME_EXTENSION_ID: ${{ secrets.EXTENSION_CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.EXTENSION_CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ vars.EXTENSION_CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.EXTENSION_CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          BUILD_VERSION: ${{ inputs.build_version }}
