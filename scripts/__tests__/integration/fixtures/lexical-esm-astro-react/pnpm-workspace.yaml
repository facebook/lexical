# This fixture is a standalone project rather than a member of the Lexical
# monorepo workspace. Its own pnpm-workspace.yaml makes this directory the
# workspace root for a `pnpm install` run here, so pnpm never climbs into the
# monorepo above it.
#
# No dependency build script is approved here, which is how these fixtures have
# always installed. pnpm 11 fails an install over skipped build scripts unless
# every one of them is decided, so keep that a warning instead.
strictDepBuilds: false

# Was `pnpm.overrides` in package.json, which pnpm 11 no longer reads.
overrides:
  yaml-language-server: '>=1.20.0'
